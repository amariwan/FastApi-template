version: '3.9'

services:
     workspace:
          build:
               context: ..
               dockerfile: .devcontainer/Dockerfile
          volumes:
               - ..:/workspace:cached
          command: sleep infinity
          environment:
               DATABASE_URL: "postgresql://{{ cookiecutter.db_username }}:{{ cookiecutter.db_password }}@postgres:{{ cookiecutter.db_port }}/{{ cookiecutter.db_database }}"
          depends_on:
               postgres:
                    condition: service_healthy

     postgres:
          image: "{{ cookiecutter.devcontainer_postgres_image }}"
          command: ['postgres', '-c', 'port={{ cookiecutter.db_port }}']
          restart: always
          environment:
               POSTGRES_USER: "{{ cookiecutter.db_username }}"
               POSTGRES_PASSWORD: "{{ cookiecutter.db_password }}"
               POSTGRES_DB: "{{ cookiecutter.db_database }}"
          ports:
               - '{{ cookiecutter.db_port }}:{{ cookiecutter.db_port }}'
          volumes:
               - postgres_data:/var/lib/postgresql/data
          healthcheck:
               test: ['CMD-SHELL', 'pg_isready -U {{ cookiecutter.db_username }} -d {{ cookiecutter.db_database }} -h localhost -p {{ cookiecutter.db_port }}']
               interval: 5s
               timeout: 3s
               retries: 20

volumes:
     postgres_data:
